[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dixi-spec-kit"
version = "1.1.0"
description = "Specification-driven development kit with traceability, verification and Claude Code commands"
readme = "packaging/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["src/dixi_spec_kit/LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/dixi-project/dixi-spec-kit"

[project.scripts]
dixi = "dixi_spec_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dixi_spec_kit"]
include-package-data = false

[tool.setuptools.package-data]
dixi_spec_kit = ["locales/es.json", "locales/en.json", "resources/project.es.json", "resources/project.en.json", "resources/workflows.json", "resources/workflows.es.json", "resources/workflows.en.json",
